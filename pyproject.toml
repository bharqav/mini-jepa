[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-jepa"
version = "0.2.0"
description = "Order-invariant decision models and a JEPA-style latent predictor built on a truncated Qwen3 backbone"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "decision-models",
  "jepa",
  "self-supervised-learning",
  "representation-learning",
  "qwen3",
  "calibration",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.44.0",
  "peft>=0.12.0",
  "datasets>=3.0.0",
  "numpy>=1.26",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "fastparquet>=0.8",
  "pandas>=2.0",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]
teacher = ["tqdm>=4.66"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp>=1.25",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "ruff>=0.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/bharqav/mini-jepa"
Issues = "https://github.com/bharqav/mini-jepa/issues"
Changelog = "https://github.com/bharqav/mini-jepa/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `-q` here: CI and the Makefile pass their own verbosity, and combining
# flags suppresses pytest's summary line (which quality gates parse).
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["jev_qwen"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = [
  "src/jev_qwen/api.py",
  "src/jev_qwen/auth.py",
  "src/jev_qwen/metrics.py",
  "src/jev_qwen/tracing.py",
  "scripts/load_test.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "runs", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # function calls in defaults are idiomatic for FastAPI dependencies
  "B905",   # zip(strict=): our zips intentionally pair ragged collections
  "E731",   # lambdas are idiomatic for tiny local callbacks (scoring kernels)
  "E741",   # `l` is used for "loss"/"label" throughout; renaming adds noise
  "UP031",  # %-format is clearer than f-strings for aligned numeric tables
  "C416",   # dict comprehensions are used where explicit is clearer
  "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["jev_qwen"]