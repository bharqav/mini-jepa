name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / test / security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/ scripts/

      - name: Tests (no model weights required)
        run: pytest tests/ -v

      - name: Secret scan
        run: python scripts/security_scan.py

      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable

      - name: Documentation check (links + mermaid)
        run: python scripts/docs_check.py

      - name: Import smoke (package is installable and importable)
        run: python -c "import jev_qwen, jev_qwen.jepa, jev_qwen.model, jev_qwen.schema; print('import ok')"

  weights:
    name: integration (real Qwen3-0.6B)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Cache Hugging Face weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-0.6b-${{ hashFiles('src/jev_qwen/*.py') }}
          restore-keys: hf-qwen3-0.6b-

      - name: Full test suite with real backbone
        env:
          JEV_REAL_WEIGHTS: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/ -v --tb=short