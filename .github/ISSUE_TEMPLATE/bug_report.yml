name: Bug report
description: Something behaves differently from what the docs or code suggest
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this template for
        security vulnerabilities — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: The model returned an unnormalised probability vector …
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The exact command or minimal code that triggers it.
      render: bash
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Paste the output of `python scripts/inspect_environment.py`.
        Include OS, Python version, torch build, and whether CUDA is in use.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Tokenisation / attention mask
        - Model / decision head
        - Training
        - Evaluation / metrics
        - Inference engine
        - FastAPI service
        - JEPA module
        - Data pipeline
        - Docs / build
    validations:
      required: true

  - type: textarea
    id: checkpoint
    attributes:
      label: Checkpoint or config
      description: Which config/checkpoint was used, if any.
      render: yaml

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I ran `make check` and can describe the result