name: Feature request
description: Suggest a capability or an experiment worth running
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Experimental requests are welcome — this is a research library and
        "what would test this hypothesis?" is a perfectly good framing.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the current code cannot?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Sketch of the approach, including which modules it touches.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Decision model / heads
        - JEPA / representation learning
        - Data pipeline / adapters
        - Evaluation / statistics
        - Serving / API
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this and open a PR
        - label: I would be happy to review a PR for this
        - label: Discussion only for now