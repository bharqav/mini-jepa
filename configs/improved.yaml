# Improved: CompatHead (no inter-candidate attention => strict invariance by
# construction) + candidate-order augmentation + per-task temperature.
# Same backbone/budget as baseline so the ablation is controlled.
seed: 0
model:
  name: Qwen/Qwen3-0.6B
  num_layers: 12
data:
  dataset: avbiswas/bev-decision-150K
  subset: all
  max_train_questions: 20000
  max_test_questions: 2000
  max_state_tokens: 512
  max_choice_tokens: 64
  batch_size: 8
  # 0 is the safe default: DataLoader workers use fork/forkserver, which is
  # flaky under WSL2 and on locked-down Windows hosts. Raise on a normal box
  # if profiling shows tokenization is the bottleneck.
  num_workers: 0
  permute_candidates: true
lora:
  last_k_layers: 4
  r: 8
  alpha: 16
  dropout: 0.0
head:
  type: compat
  new_dim: 512
calibration:
  temperature_scaling: true
optim:
  epochs: 1
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  grad_accum_steps: 4
  precision: bf16
logging:
  log_every: 20
  eval_every: 500
  save_every: 500
