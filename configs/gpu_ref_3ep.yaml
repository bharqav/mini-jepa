# Control for gpu_improved_3ep.yaml: reference head, identical data, seed,
# budget and epochs. The head is the only difference.
seed: 0
model:
  name: Qwen/Qwen3-0.6B
  num_layers: 12
data:
  dataset: avbiswas/bev-decision-150K
  subset: all
  max_train_questions: 20000
  max_test_questions: 2000
  max_state_tokens: 512
  max_choice_tokens: 64
  batch_size: 8
  num_workers: 0
lora:
  last_k_layers: 4
  r: 8
  alpha: 16
  dropout: 0.0
head:
  type: reference
  new_dim: 512
  num_layers: 2
optim:
  epochs: 3
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  grad_accum_steps: 4
  precision: bf16
logging:
  log_every: 20
  eval_every: 300
  save_every: 600