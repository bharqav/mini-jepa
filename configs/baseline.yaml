# Baseline: reference-faithful head, first 12 layers, LoRA on last 4 kept layers.
# Fits 8GB VRAM: micro-batch 8, accum 4 => 32 questions/step. BF16 on RTX 5060.
seed: 0
model:
  name: Qwen/Qwen3-0.6B
  num_layers: 12
data:
  dataset: avbiswas/bev-decision-150K
  subset: all
  max_train_questions: 20000
  max_test_questions: 2000
  max_state_tokens: 512
  max_choice_tokens: 64
  batch_size: 8
  # 0 = safe default (fork/forkserver workers are flaky under WSL2 and
  # locked-down Windows). Raise after profiling on a normal host.
  num_workers: 0
lora:
  last_k_layers: 4
  r: 8
  alpha: 16
  dropout: 0.0
head:
  type: reference
  new_dim: 512
  num_layers: 2
optim:
  epochs: 1
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  grad_accum_steps: 4
  precision: bf16
logging:
  log_every: 20
  eval_every: 500
  save_every: 500
