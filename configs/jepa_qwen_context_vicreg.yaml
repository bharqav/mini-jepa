# Causal JEPA with VICReg terms on the context encoder as well as the
# predictor. Measured negative: target/predictor and mean-pooled sentence
# representations still collapse; kept as an ablation, not a recommended config.
# Run: python scripts/train_jepa.py configs/jepa_qwen_context_vicreg.yaml --name jepa-qwen-ctx-vicreg
seed: 0
model:
  name: Qwen/Qwen3-0.6B
  num_layers: 8
  revision: c1899de289a04d12100db370d81485cdf75e47ca
data:
  dataset: avbiswas/bev-decision-150K
  subset: all
  max_train_questions: 20000
  max_test_questions: 2000
  max_state_tokens: 512
  max_choice_tokens: 64
  batch_size: 8
  num_workers: 0
jepa:
  predictor_layers: 2
  predictor_dim: 512
  mask_ratio: 0.20
  mask_span: 8
  ema_momentum: 0.996
  ema_momentum_end: 1.0
  loss_mse: 1.0
  loss_cosine: 0.1
  var_weight: 0.2
  cov_weight: 0.08
  var_target_std: 1.0
  regularize_context: true
  bidirectional_context: false
optim:
  steps: 2000
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  precision: bf16
logging:
  log_every: 50
  eval_every: 500
  max_len: 256
  max_sequences: 8000
  eval_max_sequences: 256
probe:
  data:
    max_train_questions: 20000
    max_test_questions: 2000
  lora:
    last_k_layers: 0
    r: 8
    alpha: 16
    dropout: 0.0
  head:
    type: compat
    new_dim: 512
  optim:
    epochs: 1
    lr_lora: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.01
    warmup_ratio: 0.05
    grad_clip: 1.0
    grad_accum_steps: 4
    precision: bf16
  logging:
    log_every: 20
    eval_every: 300
    save_every: 600
  optim:
    epochs: 1
    lr_lora: 1.0e-4
    lr_head: 1.0e-3
    weight_decay: 0.01
    warmup_ratio: 0.05
    grad_clip: 1.0
    grad_accum_steps: 4
    precision: bf16
  logging:
    log_every: 20
    eval_every: 300
    save_every: 600
